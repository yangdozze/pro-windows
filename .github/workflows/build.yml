name: Build Palmier Pro Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
      - windows/src/**
      - windows/tests/**
      - windows/scripts/**
      - windows/PalmierPro.sln
      - windows/Directory.Build.props
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 180

    steps:
      - name: Check out pro-windows source
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        working-directory: source
        run: dotnet restore windows/PalmierPro.sln

      - name: Build Windows app
        shell: pwsh
        working-directory: source
        run: dotnet build windows/PalmierPro.sln -c Release --no-restore

      - name: Run Windows port tests
        shell: pwsh
        working-directory: source
        run: |
          $projects = Get-ChildItem windows/tests -Recurse -Filter *.csproj
          if (-not $projects) { throw "No Windows test projects found." }
          foreach ($project in $projects) {
            Write-Host "Testing $($project.FullName)"
            dotnet test $project.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package self-contained installer
        shell: pwsh
        working-directory: source
        run: |
          $version = "0.1.${{ github.run_number }}"
          & windows/scripts/pack.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = "windows/artifacts/velopack/PalmierPro-$version-win-x64-Portable.zip"
          Compress-Archive -Path windows/artifacts/publish/win-x64/* -DestinationPath $portable -CompressionLevel Optimal -Force

      - name: Smoke-test packaged Windows app
        shell: pwsh
        working-directory: source
        run: |
          $exe = Resolve-Path windows/artifacts/publish/win-x64/PalmierPro.exe
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "PalmierPro.exe exited during startup smoke test (code $($process.ExitCode))."
            }
            Write-Host "PalmierPro.exe stayed running through startup."
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Verify package and write checksums
        shell: pwsh
        working-directory: source
        run: |
          $setup = Get-ChildItem windows/artifacts/velopack -Filter *Setup.exe | Select-Object -First 1
          $portable = Get-ChildItem windows/artifacts/velopack -Filter *Portable.zip | Select-Object -First 1
          if (-not $setup) { throw "Windows installer was not produced." }
          if (-not $portable) { throw "Portable Windows package was not produced." }
          $files = @($setup, $portable)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content windows/artifacts/velopack/SHA256SUMS.txt
          @(
            "Palmier Pro Windows build"
            "Source: https://github.com/palmier-io/palmier-pro"
            "Windows port base: https://github.com/Yasser-Belatreche/palmier-pro/commit/974dd45e6e7c6e8b9f3f0e2e5869a1f2393d2ff7"
            "Build repository: https://github.com/yangdozze/pro-windows"
            "Build commit: ${{ github.sha }}"
            "Architecture: Windows x64"
          ) | Set-Content windows/artifacts/velopack/BUILD_SOURCE.txt
          Get-Content windows/artifacts/velopack/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Palmier-Pro-Windows-x64
          path: source/windows/artifacts/velopack/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish prerelease
        shell: pwsh
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v0.1.${{ github.run_number }}"
          $assets = @(
            Get-ChildItem windows/artifacts/velopack -File |
              Select-Object -ExpandProperty FullName
          )
          if ($assets.Count -lt 4) { throw "Velopack release assets are incomplete." }
          gh release create $tag @assets --repo yangdozze/pro-windows --title "Palmier Pro Windows $tag" --notes "Native Windows x64 build of Palmier Pro from this repository. Includes the Windows editor, Agent tools, Anthropic/OpenAI BYOK support, tests, and packaging provenance."
